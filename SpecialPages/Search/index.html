    <link rel="canonical" href="https://grapeleafi.top/SpecialPages/Search/index.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="藤栖龟舍 VineTurtle Studio" />
    <meta property="og:title" content="搜索 · 藤栖龟舍" />

    <link rel="stylesheet" href="../../CSS/layout.css" />
    <link rel="stylesheet" href="../../CSS/style.css" />

<body>
<noscript><div class="noscript-warn">本站需要启用 JavaScript 才能正常显示内容。</div></noscript>
<div id="header-placeholder"></div>
<main class="search-main">
    <div class="container">
        <div class="page-header">
            <h1>🔍 站内搜索</h1>
            <p>输入标题、标签或关键词，搜索文章与项目</p>
        </div>

        <form class="search-form" role="search" id="searchForm">
            <label class="visually-hidden" for="searchInput">搜索关键词</label>
            <input id="searchInput" type="search" name="q" placeholder="例如：Electron、TLS、图标、VinePalma…" autocomplete="off" />
            <button type="submit">搜索</button>
        </form>

        <p class="search-status" id="searchStatus" role="status">正在加载索引…</p>
        <div class="search-results" id="searchResults"></div>
    </div>
</main>
<div id="footer-placeholder"></div>
<div class="month-badge" id="monthBadge">🌿 1月</div>
</body>
