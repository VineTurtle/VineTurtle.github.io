<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2a5c3a">
    <meta name="robots" content="noindex">
    <title>页面走丢了 · 藤栖龟舍</title>
    <link rel="icon" href="/Resources/images/VineTurtleStudio.png" type="image/png">
    <style>
        :root { --primary: #2a5c3a; --accent: #4a7c5b; --bg: #e4efe1; --text: #23382c; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px 20px;
            background: radial-gradient(circle at 50% 0%, #f2f8ee, var(--bg) 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            text-align: center;
        }
        .card {
            width: min(560px, 100%);
            padding: 40px 32px 34px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(42, 92, 58, 0.08);
        }
        .logo { width: 78px; height: 78px; border-radius: 50%; background: #fff; padding: 10px; box-shadow: 0 4px 14px rgba(42, 92, 58, 0.12); }
        h1 { margin: 18px 0 6px; font-size: 1.5rem; color: var(--primary); letter-spacing: 0.02em; }
        p { margin: 0 0 6px; line-height: 1.7; opacity: 0.78; }
        .code { font-size: 3rem; margin: 6px 0 2px; opacity: 0.85; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
        .links a {
            padding: 9px 18px;
            border-radius: 999px;
            border: 1px solid rgba(42, 92, 58, 0.28);
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.15s;
        }
        .links a:hover, .links a:focus-visible { background: #fff; transform: translateY(-1px); }
        .links a.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .links a.primary:hover { background: var(--accent); }
        footer { margin-top: 18px; font-size: 0.78rem; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/Resources/images/VineTurtleStudio.png" alt="藤栖龟舍">
        <div class="code">🌿 404</div>
        <h1>这条小路通往林外了</h1>
        <p>你要找的页面不存在，或者已经被移走。</p>
        <p>不妨从这里重新出发：</p>
        <div class="links">
            <a class="primary" href="/">回到首页</a>
            <a href="/SpecialPages/Project/index.html">项目</a>
            <a href="/SpecialPages/Blog/index.html">博客</a>
            <a href="/SpecialPages/Gallery/index.html">画廊</a>
        </div>
        <footer>© 2026 藤栖龟舍 VineTurtle Studio</footer>
    </div>
</body>
</html>
