<p><strong>项目概述：</strong>VinePalma Player 是藤栖龟舍基于 Electron 开发的桌面媒体播放器，为 Linux 桌面环境提供简洁流畅的本地播放体验。</p>

<h2>🎯 项目定位</h2>
<ul>
    <li>专注本地音视频播放，启动轻量、操作克制</li>
    <li>适配 Linux 桌面环境，与系统风格自然融合</li>
    <li>以简洁、沉稳的设计语言贯穿交互细节</li>
</ul>

<h2>🔧 技术栈</h2>
<ul>
    <li>Electron 桌面框架</li>
    <li>Linux 平台优先适配</li>
</ul>
