<p><strong>项目概述：</strong>以森林四季为灵感，创作了 12 幅动态数字插画，作为「森林小镇」系列数字藏品发行。</p>

<h2>🎨 创作理念</h2>
<ul>
    <li>以苔藓绿为主的森林四季色调</li>
    <li>每幅作品对应一个月度自然主题</li>
    <li>动态光影与细腻的插画笔触</li>
</ul>

<h2>🖼️ 作品系列</h2>
<p>12 幅作品依次呈现春芽、夏荫、秋叶、冬雪等自然意象，共同组成一座随时间流转的森林小镇。</p>
