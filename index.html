<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藤栖龟舍 - VineTurtle Studio</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <script src="./JS/script.js" defer></script>
</head>
<body>

<!-- 背景层 -->
<div class="bg-decoration"></div>

<!-- 主容器 -->
<main class="container">
    <!-- 徽标区域 -->
    <header class="logo-section">
        <img src="./Resources/images/VineTurtleStudio.png" alt="藤栖龟舍 Logo" class="studio-logo">
        <h1 class="studio-name">藤栖龟舍</h1>
        <p class="tagline">根植森林，四季共栖。</p>
    </header>

    <!-- 内容介绍区域（由组织自定义） -->
    <section class="intro-section">
        <p>欢迎来到藤栖龟舍。<br>
            这里是藤蔓与龟影交织的创意工坊，记录着森林小镇的四季故事。</p>

        <div class="feature-grid">
            <div class="feature-item">
                <span class="icon">🌿</span>
                <h3>藤栖之域</h3>
                <p>自然美学与数字灵感的栖息地</p>
            </div>
            <div class="feature-item">
                <span class="icon">🐢</span>
                <h3>龟舍时光</h3>
                <p>缓慢而坚定的创作旅程</p>
            </div>
        </div>
    </section>

    <!-- 月份与心情展示（颜色随月变化） -->
    <section class="mood-section" id="moodSection">
        <p class="mood-text" id="moodText">🌿 森林小镇迎来新的月份...</p>
        <div class="month-indicator" id="monthIndicator">当前月份：1月</div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 藤栖龟舍 VineTurtle Studio. 林间岁月，温柔相守。</p>
    </footer>
</main>

</body>
</html>
