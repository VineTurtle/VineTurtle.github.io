    <style>
        :root { --primary: #2a5c3a; --accent: #4a7c5b; --bg: #e4efe1; --text: #23382c; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px 20px;
            background: radial-gradient(circle at 50% 0%, #f2f8ee, var(--bg) 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            text-align: center;
        }
        .card {
            width: min(560px, 100%);
            padding: 40px 32px 34px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(42, 92, 58, 0.08);
        }
        .logo { width: 78px; height: 78px; border-radius: 50%; background: #fff; padding: 10px; box-shadow: 0 4px 14px rgba(42, 92, 58, 0.12); }
        h1 { margin: 18px 0 6px; font-size: 1.5rem; color: var(--primary); letter-spacing: 0.02em; }
        p { margin: 0 0 6px; line-height: 1.7; opacity: 0.78; }
        .code { font-size: 3rem; margin: 6px 0 2px; opacity: 0.85; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
        .links a {
            padding: 9px 18px;
            border-radius: 999px;
            border: 1px solid rgba(42, 92, 58, 0.28);
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.15s;
        }
        .links a:hover, .links a:focus-visible { background: #fff; transform: translateY(-1px); }
        .links a.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .links a.primary:hover { background: var(--accent); }
        footer { margin-top: 18px; font-size: 0.78rem; opacity: 0.5; }

        html[data-theme="dark"] {
            --primary: #a6d8ad;
            --accent: #8fc79b;
            --bg: #0f1511;
            --text: #dbe6dd;
        }
        html[data-theme="dark"] body {
            background: radial-gradient(circle at 50% 0%, #1b2a20, var(--bg) 70%);
        }
        html[data-theme="dark"] .card {
            background: rgba(30, 42, 34, 0.74);
            border-color: rgba(190, 225, 200, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
        }
        html[data-theme="dark"] .logo { background: #e8f0e9; }
        html[data-theme="dark"] .links a { border-color: rgba(166, 216, 173, 0.3); }
        html[data-theme="dark"] .links a:hover { background: rgba(255, 255, 255, 0.07); }
        html[data-theme="dark"] .links a.primary { background: var(--primary); color: #0b1a10; }
    </style>
