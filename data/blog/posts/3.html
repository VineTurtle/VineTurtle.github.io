<p>品牌命名「藤栖龟舍」——藤蔓的柔韧与龟的沉稳，构成了我们的精神内核。</p>

<p><strong>藤栖</strong>：藤蔓依附大树生长，象征着创意与自然的共生关系。<strong>龟舍</strong>：龟是缓慢而坚定的象征，提醒我们在快节奏的时代保持踏实前行的态度。</p>

<h2>🐢 Logo 设计</h2>

<p>Logo 图形融合了藤蔓的曲线与龟壳的几何纹路，形成一个抽象的「森林之龟」形象。文字标采用圆润的手写风格，传递温暖与亲近感。</p>

<h2>🎨 色彩系统</h2>

<p>主色为「苔藓绿」#2a5c3a，辅助色为「树皮棕」和「晨雾灰」。整套色彩系统均取自森林中的自然元素，确保视觉的一致性。</p>
